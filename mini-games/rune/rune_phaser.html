<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кузня Рун на Phaser 3</title>
    <!-- Подключаем Phaser 3 через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            background: #05070c;
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Georgia', serif;
            user-select: none;
            overflow: hidden;
        }
        .container {
            display: flex;
            background: #0f172a;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            border: 1px solid #1e293b;
            gap: 25px;
        }
        #game-container {
            width: 450px;
            height: 420px;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #334155;
        }
        .panel {
            display: flex;
            flex-direction: column;
            width: 320px;
            justify-content: space-between;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 20px;
            color: #f3f4f6;
            border-bottom: 2px solid #334155;
            padding-bottom: 5px;
        }
        .description {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 15px;
            font-style: italic;
            height: 50px;
        }
        .select-group {
            margin-bottom: 12px;
        }
        .select-group label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }
        select {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 13px;
        }
        .controls-info {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #94a3b8;
            border: 1px solid #334155;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .controls-info b {
            color: #f3f4f6;
        }
        .btn-carve {
            padding: 14px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
            transition: all 0.2s;
            width: 100%;
        }
        .btn-carve:hover:not(:disabled) {
            background: #f87171;
            transform: translateY(-2px);
        }
        .btn-carve:disabled {
            background: #334155;
            box-shadow: none;
            cursor: not-allowed;
            color: #64748b;
        }
        .status-text {
            font-size: 14px;
            color: #fbbf24;
            font-weight: bold;
            margin-top: 10px;
            min-height: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Контейнер для Phaser игры -->
        <div id="game-container"></div>

        <!-- Управление и настройки -->
        <div class="panel">
            <div>
                <h1 id="runeName">Кузня Рун</h1>
                <div class="description" id="runeDesc">Выберите руну и подготовьте заготовку.</div>
                
                <div class="select-group">
                    <label>Выберите руну:</label>
                    <select id="runeSelect">
                        <option value="uragg">Урагг ⚡ (Ярость — Зигзаг)</option>
                        <option value="morrg">Моррг 🩸 (Сбережение Крови — Дуга)</option>
                    </select>
                </div>

                <div class="select-group">
                    <label>Носитель (Материал):</label>
                    <select id="mediumSelect">
                        <option value="item">На предмет (Железо)</option>
                        <option value="skin">На кожу (Кровавый ритуал)</option>
                        <option value="scroll">На свиток (Каллиграфия)</option>
                    </select>
                </div>

                <div class="select-group">
                    <label>Жертва шамана:</label>
                    <select id="sacrificeSelect">
                        <option value="none">Без жертвы (Экстремальный риск)</option>
                        <option value="blood">Жертва Крови (+50% к окну тайминга)</option>
                        <option value="memory">Жертва Памяти (Движение медленнее)</option>
                    </select>
                </div>

                <div class="controls-info">
                    <b>Управление:</b> Зажимайте стрелки клавиатуры в направлении движения резца. Жмите Пробел на мишенях.
                </div>
            </div>

            <div>
                <div class="status-text" id="statusOutput">Ожидание начала...</div>
                <button class="btn-carve" id="startBtn">Начать обряд</button>
            </div>
        </div>
    </div>

    <script>
        // Данные рун
        const RUNES = {
            uragg: {
                name: "Урагг ⚡ (Ярость)",
                desc: "Зигзаг, как молния. Требует быстрой смены направления стрелок и точных ударов.",
                points: [
                    {x: 80, y: 110},  
                    {x: 370, y: 160}, 
                    {x: 100, y: 260}, 
                    {x: 350, y: 310}  
                ],
                steps: [
                    { type: 'hold', key: 'ArrowRight', startT: 0, endT: 0.33, text: '→' },
                    { type: 'tap', key: 'Space', t: 0.33, text: 'ПРОБЕЛ', hit: false },
                    { type: 'hold', key: 'ArrowLeft', startT: 0.33, endT: 0.66, text: '←' },
                    { type: 'tap', key: 'Space', t: 0.66, text: 'ПРОБЕЛ', hit: false },
                    { type: 'hold', key: 'ArrowRight', startT: 0.66, endT: 1.0, text: '→' }
                ]
            },
            morrg: {
                name: "Моррг 🩸 (Сбережение Крови)",
                desc: "Дуга со штрихами. Плавное движение по кругу завершается серией точечных ударов резца.",
                points: [
                    {x: 100, y: 240}, {x: 150, y: 150}, {x: 225, y: 120}, {x: 300, y: 150}, {x: 350, y: 240},
                    {x: 170, y: 180}, {x: 170, y: 230},
                    {x: 225, y: 160}, {x: 225, y: 210},
                    {x: 280, y: 180}, {x: 280, y: 230}
                ],
                steps: [
                    { type: 'hold', key: 'ArrowUp', startT: 0, endT: 0.2, text: '↑' },
                    { type: 'hold', key: 'ArrowRight', startT: 0.2, endT: 0.4, text: '→' },
                    { type: 'hold', key: 'ArrowDown', startT: 0.4, endT: 0.6, text: '↓' },
                    { type: 'tap', key: 'Space', t: 0.68, text: 'ПРОБЕЛ', hit: false },
                    { type: 'tap', key: 'Space', t: 0.78, text: 'ПРОБЕЛ', hit: false },
                    { type: 'tap', key: 'Space', t: 0.88, text: 'ПРОБЕЛ', hit: false },
                    { type: 'hold', key: 'ArrowRight', startT: 0.9, endT: 1.0, text: '→' }
                ]
            }
        };

        // Настройки материалов (стилей)
        const MEDIUMS = {
            item: {
                bg: 0x111827,
                borderColor: 0x4b5563,
                lineBaseColor: 0x374151,
                lineCarvedColor: 0xf97316, 
                shadowColor: 0xef4444,
                particleColor: 0xf59e0b,
                tapColor: 0x38bdf8,
                helpText: "На предмет: Избегайте перегрева. Провал уничтожит заготовку!",
                errorText: "ИСКРЫ!",
                missText: "ПРОМАХ!"
            },
            skin: {
                bg: 0x1c0505,
                borderColor: 0x991b1b,
                lineBaseColor: 0x450a0a,
                lineCarvedColor: 0xd97706, 
                shadowColor: 0xdc2626,
                particleColor: 0xef4444,
                tapColor: 0xf87171,
                helpText: "На кожу: Терпите боль. Ошибка лишит вас здоровья или разума!",
                errorText: "БОЛЬ!",
                missText: "РАЗРЫВ!"
            },
            scroll: {
                bg: 0xf5f5f4,
                borderColor: 0xcbd5e1,
                lineBaseColor: 0xe2e8f0,
                lineCarvedColor: 0x1e1b4b, 
                shadowColor: 0x4f46e5,
                particleColor: 0x6366f1,
                tapColor: 0x4f46e5,
                helpText: "На свиток: Будьте точны. Не задерживайте перо, иначе пергамент сгорит!",
                errorText: "КЛЯКСА!",
                missText: "ПЯТНО!"
            }
        };

        // Класс Сцены Phaser 3
        class RuneForgeScene extends Phaser.Scene {
            constructor() {
                super({ key: 'RuneForgeScene' });
            }

            init(data) {
                this.selectedRune = RUNES[data.rune] || RUNES.uragg;
                this.selectedMedium = MEDIUMS[data.medium] || MEDIUMS.item;
                this.selectedSacrifice = data.sacrifice || 'none';
                this.onCompleteCallback = data.onComplete;

                this.isRunning = false;
                this.progress = 0;
                this.speed = 0.0015;
                this.instability = 0;
                this.activeTapWindow = 0.04;
                this.particles = [];

                // Сброс шагов руны
                this.selectedRune.steps.forEach(s => { if (s.type === 'tap') s.hit = false; });
            }

            create() {
                // Создаем слои графики
                this.bgGraphics = this.add.graphics();
                this.baseRuneGraphics = this.add.graphics();
                this.carvedRuneGraphics = this.add.graphics();
                this.cursorGraphics = this.add.graphics();
                this.uiGraphics = this.add.graphics();

                // Отрисовка фона наковальни / пергамента
                this.bgGraphics.fillStyle(this.selectedMedium.bg, 1);
                this.bgGraphics.fillRect(10, 10, 430, 400);
                this.bgGraphics.lineStyle(4, this.selectedMedium.borderColor, 1);
                this.bgGraphics.strokeRect(10, 10, 430, 400);

                // Создаем плавающий текст над курсором
                this.promptText = this.add.text(0, 0, '•', {
                    fontSize: '11px',
                    fontFamily: 'monospace',
                    color: '#ffffff',
                    backgroundColor: 'rgba(0,0,0,0.85)',
                    padding: { x: 8, y: 4 }
                }).setOrigin(0.5, 1).setVisible(false);

                // Инициализация кнопок
                this.cursors = this.input.keyboard.createCursorKeys();
                this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

                // Слушаем нажатие пробела
                this.input.keyboard.on('keydown-SPACE', () => {
                    if (this.isRunning) {
                        this.checkTapHit();
                    }
                });

                this.startForge();
            }

            startForge() {
                let speedMultiplier = 1.0;
                let tapWindowMultiplier = 1.0;

                if (this.selectedSacrifice === 'memory') {
                    speedMultiplier = 0.75; // Замедление для Жертвы Памяти
                } else if (this.selectedSacrifice === 'blood') {
                    tapWindowMultiplier = 1.5; // Более легкие тайминги для Жертвы Крови
                }

                this.isRunning = true;
                this.progress = 0;
                this.instability = 0;
                this.speed = 0.0015 * speedMultiplier;
                this.activeTapWindow = 0.04 * tapWindowMultiplier;
                this.promptText.setVisible(true);

                this.drawStaticRune();
            }

            drawStaticRune() {
                this.baseRuneGraphics.clear();
                this.baseRuneGraphics.lineStyle(10, this.selectedMedium.lineBaseColor, 1);

                const pts = this.selectedRune.points;
                this.baseRuneGraphics.beginPath();
                this.baseRuneGraphics.moveTo(pts[0].x, pts[0].y);

                for (let i = 1; i < pts.length; i++) {
                    const dist = Phaser.Math.Distance.Between(pts[i].x, pts[i - 1].x, pts[i].y, pts[i - 1].y);
                    if (dist > 80) {
                        this.baseRuneGraphics.moveTo(pts[i].x, pts[i].y);
                    } else {
                        this.baseRuneGraphics.lineTo(pts[i].x, pts[i].y);
                    }
                }
                this.baseRuneGraphics.strokePath();

                // Отрисовка колец
                this.selectedRune.steps.forEach(s => {
                    if (s.type === 'tap') {
                        const pos = this.getCursorPosition(s.t);
                        this.baseRuneGraphics.lineStyle(2, this.selectedMedium.tapColor, 1);
                        this.baseRuneGraphics.strokeCircle(pos.x, pos.y, 14);
                        this.baseRuneGraphics.fillStyle(this.selectedMedium.tapColor, 0.15);
                        this.baseRuneGraphics.fillCircle(pos.x, pos.y, 5);
                    }
                });
            }

            getCursorPosition(t) {
                const pts = this.selectedRune.points;
                let lengths = [];
                let totalLength = 0;

                for (let i = 0; i < pts.length - 1; i++) {
                    const dist = Phaser.Math.Distance.Between(pts[i].x, pts[i + 1].x, pts[i].y, pts[i + 1].y);
                    lengths.push(dist);
                    totalLength += dist;
                }

                const targetDist = t * totalLength;
                let accumulated = 0;

                for (let i = 0; i < lengths.length; i++) {
                    if (accumulated + lengths[i] >= targetDist) {
                        const localT = (targetDist - accumulated) / lengths[i];
                        return {
                            x: pts[i].x + (pts[i+1].x - pts[i].x) * localT,
                            y: pts[i].y + (pts[i+1].y - pts[i].y) * localT,
                            isGap: lengths[i] > 80
                        };
                    }
                    accumulated += lengths[i];
                }

                return { x: pts[pts.length - 1].x, y: pts[pts.length - 1].y, isGap: false };
            }

            checkTapHit() {
                let hitRegistered = false;

                for (let step of this.selectedRune.steps) {
                    if (step.type === 'tap' && !step.hit) {
                        const timeDiff = Math.abs(this.progress - step.t);
                        const pos = this.getCursorPosition(step.t);

                        if (timeDiff < this.activeTapWindow) {
                            step.hit = true;
                            hitRegistered = true;
                            this.createSparks(pos.x, pos.y, this.selectedMedium.particleColor, 20);
                            this.instability = Math.max(0, this.instability - 15);
                            this.showFloatingText("ОТЛИЧНО!", pos.x, pos.y, this.selectedMedium.particleColor);
                            break;
                        } else if (timeDiff < this.activeTapWindow * 2) {
                            step.hit = true;
                            hitRegistered = true;
                            this.createSparks(pos.x, pos.y, this.selectedMedium.particleColor, 10);
                            this.instability = Math.max(0, this.instability - 5);
                            this.showFloatingText("ХОРОШО", this.selectedMedium.particleColor);
                            break;
                        }
                    }
                }

                if (!hitRegistered) {
                    this.instability += 8;
                    const curPos = this.getCursorPosition(this.progress);
                    this.showFloatingText(this.selectedMedium.missText, curPos.x, curPos.y, 0xef4444);
                    this.createSparks(curPos.x, curPos.y, 0xef4444, 5);
                }
            }

            createSparks(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6 - 2,
                        color: color,
                        alpha: 1,
                        life: 1.0
                    });
                }
            }

            showFloatingText(text, x, y, color) {
                const hexColor = '#' + color.toString(16).padStart(6, '0');
                const fText = this.add.text(x, y - 20, text, {
                    fontSize: '12px',
                    fontFamily: 'Georgia',
                    color: hexColor,
                    fontStyle: 'bold'
                }).setOrigin(0.5);

                this.tweens.add({
                    targets: fText,
                    y: y - 50,
                    alpha: 0,
                    duration: 800,
                    onComplete: () => fText.destroy()
                });
            }

            update(time, delta) {
                if (!this.isRunning) return;

                const dt = delta / 16.66;
                this.progress += this.speed * dt;

                if (this.progress >= 1) {
                    const missedTaps = this.selectedRune.steps.some(s => s.type === 'tap' && !s.hit);
                    if (missedTaps) this.instability += 25;

                    this.endGame(this.instability < 100);
                    return;
                }

                // Проверка зажатых кнопок
                const activeStep = this.selectedRune.steps.find(s => {
                    return s.type === 'hold' && this.progress >= s.startT && this.progress <= s.endT;
                });

                if (activeStep) {
                    const isCorrect = this.checkKeyboardState(activeStep.key);
                    const curPos = this.getCursorPosition(this.progress);

                    if (!isCorrect) {
                        this.instability += 0.55 * dt;
                        if (Math.random() > 0.6) {
                            this.createSparks(curPos.x, curPos.y, this.selectedMedium.particleColor, 1);
                        }
                    } else {
                        this.instability = Math.max(0, this.instability - 0.1 * dt);
                    }
                }

                // Проверка пропусков пробела
                this.selectedRune.steps.forEach(step => {
                    if (step.type === 'tap' && !step.hit && this.progress > step.t + 0.08) {
                        step.hit = true;
                        this.instability += 20;
                        const pos = this.getCursorPosition(step.t);
                        this.showFloatingText("ПРОПУСК!", pos.x, pos.y, 0xef4444);
                    }
                });

                // Обновление частиц
                this.particles.forEach(p => {
                    p.life -= 0.03 * dt;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 0.08 * dt;
                    p.alpha = Math.max(0, p.life);
                });
                this.particles = this.particles.filter(p => p.life > 0);

                this.drawCarvedProgress();
                this.drawUI();
            }

            checkKeyboardState(key) {
                if (key === 'ArrowUp') return this.cursors.up.isDown;
                if (key === 'ArrowDown') return this.cursors.down.isDown;
                if (key === 'ArrowLeft') return this.cursors.left.isDown;
                if (key === 'ArrowRight') return this.cursors.right.isDown;
                if (key === 'Space') return this.spaceKey.isDown;
                return false;
            }

            drawCarvedProgress() {
                this.carvedRuneGraphics.clear();

                // Отрисовка раскаленного следа
                this.carvedRuneGraphics.lineStyle(6, this.selectedMedium.lineCarvedColor, 1);
                const pts = this.selectedRune.points;
                this.carvedRuneGraphics.beginPath();
                this.carvedRuneGraphics.moveTo(pts[0].x, pts[0].y);

                const totalSteps = Math.floor(this.progress * 200);
                for (let i = 1; i <= totalSteps; i++) {
                    const stepPos = this.getCursorPosition(i / 200);
                    if (stepPos.isGap) {
                        this.carvedRuneGraphics.moveTo(stepPos.x, stepPos.y);
                    } else {
                        this.carvedRuneGraphics.lineTo(stepPos.x, stepPos.y);
                    }
                }
                this.carvedRuneGraphics.strokePath();

                // Отрисовка частиц
                this.particles.forEach(p => {
                    this.carvedRuneGraphics.fillStyle(p.color, p.alpha);
                    this.carvedRuneGraphics.fillRect(p.x - 2, p.y - 2, 4, 4);
                });

                // Сжимающиеся кольца под пробел
                const currentPos = this.getCursorPosition(this.progress);
                this.selectedRune.steps.forEach(s => {
                    if (s.type === 'tap' && !s.hit) {
                        const timeDiff = s.t - this.progress;
                        if (timeDiff > 0 && timeDiff < 0.15) {
                            const pos = this.getCursorPosition(s.t);
                            this.carvedRuneGraphics.lineStyle(2, 0x38bdf8, 1);
                            this.carvedRuneGraphics.strokeCircle(pos.x, pos.y, 14 + (timeDiff * 200));
                        }
                    }
                });

                // Курсор
                this.cursorGraphics.clear();
                this.cursorGraphics.fillStyle(currentPos.isGap ? 0x9ca3af : this.selectedMedium.lineCarvedColor, 1);
                this.cursorGraphics.fillCircle(currentPos.x, currentPos.y, 7);

                this.updatePromptText(currentPos);
            }

            updatePromptText(pos) {
                let activePrompt = '•';
                let promptColor = '#6b7280';

                const currentStep = this.selectedRune.steps.find(s => {
                    if (s.type === 'hold') return this.progress >= s.startT && this.progress <= s.endT;
                    if (s.type === 'tap') return Math.abs(this.progress - s.t) < 0.1;
                    return false;
                });

                if (currentStep) {
                    activePrompt = currentStep.text;
                    if (currentStep.type === 'hold') {
                        const isCorrect = this.checkKeyboardState(currentStep.key);
                        promptColor = isCorrect ? '#10b981' : '#ef4444';
                    } else {
                        promptColor = '#' + this.selectedMedium.tapColor.toString(16).padStart(6, '0');
                    }
                }

                this.promptText.setPosition(pos.x, pos.y - 12);
                this.promptText.setText(activePrompt);
                this.promptText.setStyle({ color: promptColor });
            }

            drawUI() {
                this.uiGraphics.clear();

                // Шкала нестабильности внизу экрана Phaser
                const barX = 20;
                const barY = 385;
                const barW = 410;
                const barH = 10;

                this.uiGraphics.fillStyle(0x020617, 1);
                this.uiGraphics.fillRect(barX, barY, barW, barH);
                this.uiGraphics.lineStyle(1, 0xef4444, 1);
                this.uiGraphics.strokeRect(barX, barY, barW, barH);

                const fillW = (Math.min(100, this.instability) / 100) * barW;
                if (fillW > 0) {
                    this.uiGraphics.fillStyle(0xef4444, 1);
                    this.uiGraphics.fillRect(barX, barY, fillW, barH);
                }
                
                // Передаем значение нестабильности в HTML шкалу (просто для синхронизации)
                document.getElementById('instabilityFill').style.width = `${Math.min(100, this.instability)}%`;
            }

            endGame(success) {
                this.isRunning = false;
                this.promptText.setVisible(false);

                let penaltyText = "";

                if (!success) {
                    this.cameras.main.flash(400, 127, 29, 29);
                    this.cameras.main.shake(250, 0.015);

                    if (this.selectedMedium === MEDIUMS.item) {
                        penaltyText = "Ваше оружие расплавилось в горне, резец треснул. Металл уничтожен!";
                        if (this.selectedSacrifice === 'blood') penaltyText += " Из-за Крови вы сильно ранили палец (-15% к Ловкости).";
                    } else if (this.selectedMedium === MEDIUMS.skin) {
                        penaltyText = "Формула руны разрушила ткани. Ваша кровь обратилась в черный песок!";
                        if (this.selectedSacrifice === 'memory') {
                            penaltyText += " Вы навсегда забыли формулу этой руны.";
                        } else {
                            penaltyText += " Вы потеряли способность говорить на 1 час (Безмолвие).";
                        }
                    } else if (this.selectedMedium === MEDIUMS.scroll) {
                        penaltyText = "Пергамент вспыхнул фиолетовым огнем и сгорел дотла вместе с чернилами.";
                    }
                }

                if (this.onCompleteCallback) {
                    this.onCompleteCallback(success, penaltyText);
                }
            }
        }

        // Конфигурация игры Phaser 3
        const config = {
            type: Phaser.AUTO,
            width: 450,
            height: 420,
            parent: 'game-container',
            backgroundColor: '#090d16',
            scene: [RuneForgeScene]
        };

        const game = new Phaser.Game(config);

        // Интеграция HTML кнопок и Phaser
        const startBtn = document.getElementById('startBtn');
        const runeSelect = document.getElementById('runeSelect');
        const mediumSelect = document.getElementById('mediumSelect');
        const sacrificeSelect = document.getElementById('sacrificeSelect');
        const statusOutput = document.getElementById('statusOutput');

        // Обновление стартового описания при изменении настроек в HTML
        function updateHTMLInfo() {
            const selectedRune = RUNES[runeSelect.value];
            document.getElementById('runeName').textContent = selectedRune.name;
            document.getElementById('runeDesc').textContent = selectedRune.desc;
        }

        runeSelect.addEventListener('change', updateHTMLInfo);
        updateHTMLInfo();

        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            runeSelect.disabled = true;
            mediumSelect.disabled = true;
            sacrificeSelect.disabled = true;
            statusOutput.textContent = "Ритуал начат! Сосредоточьтесь на начертании...";
            statusOutput.style.color = '#fbbf24';

            // Напрямую перезапускаем сцену Phaser с новыми параметрами
            game.scene.stop('RuneForgeScene');
            game.scene.start('RuneForgeScene', {
                rune: runeSelect.value,
                medium: mediumSelect.value,
                sacrifice: sacrificeSelect.value,
                onComplete: (success, penaltyText) => {
                    startBtn.disabled = false;
                    runeSelect.disabled = false;
                    mediumSelect.disabled = false;
                    sacrificeSelect.disabled = false;

                    if (success) {
                        statusOutput.textContent = "УСПЕХ! Магия руны запечатана! 🎉";
                        statusOutput.style.color = '#4ade80';
                    } else {
                        statusOutput.textContent = `ПРОВАЛ! Плата: ${penaltyText}`;
                        statusOutput.style.color = '#f87171';
                    }
                }
            });
        });
    </script>
</body>
</html>
