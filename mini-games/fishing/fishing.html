<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-игра: Рыбалка</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        canvas {
            border: 3px solid #38bdf8;
            border-radius: 8px;
            background: #0b1329;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 15px;
            text-align: center;
            max-width: 250px;
        }
        .controls p {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
        }
        button:hover {
            background: #7dd3fc;
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .status {
            margin-top: 12px;
            font-weight: bold;
            height: 24px;
            color: #fbbf24;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Холст для отрисовки шкалы натяжения и рыбы -->
        <canvas id="fishingCanvas" width="120" height="350"></canvas>
        <div class="status" id="statusText">Готов к забросу</div>
        <div class="controls">
            <p>Удерживайте <b>ПРОБЕЛ</b> или <b>зажмите левую кнопку мыши</b>, чтобы поднимать зеленую зону.</p>
            <button id="startBtn">Забросить удочку</button>
        </div>
    </div>

    <script>
        // Пресеты сложности и поведения рыбы
        const FISH_PRESETS = {
            easy: { name: "Карась 🐟", speed: 0.03, chatter: 1600, barSize: 100 },
            medium: { name: "Окунь 🐠", speed: 0.06, chatter: 1100, barSize: 80 },
            hard: { name: "Щука 🦈", speed: 0.11, chatter: 600, barSize: 55 }
        };

        class FishingGame {
            constructor(canvasId, difficulty = 'easy') {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.currentFish = FISH_PRESETS[difficulty];

                // Настройки физики
                this.gravity = 0.22;
                this.lift = -0.55;
                this.friction = 0.98;

                this.barHeight = this.currentFish.barSize;
                this.barY = this.canvas.height - this.barHeight - 10;
                this.barVelocity = 0;

                this.fishY = this.canvas.height / 2;
                this.fishTargetY = this.fishY;
                this.fishTimer = 0;
                this.fishSize = 18;

                this.catchProgress = 30; // Стартовое значение шкалы поимки
                this.maxProgress = 100;
                this.isSpacePressed = false;
                this.isRunning = false;

                this.onWin = null;
                this.onLose = null;

                this.setupInput();
            }

            setupInput() {
                const startAction = (e) => { 
                    if (e.type === 'touchstart' || e.button === 0) {
                        this.isSpacePressed = true; 
                    }
                };
                const endAction = () => { this.isSpacePressed = false; };

                this.keydownHandler = (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault(); // Предотвращает прокрутку страницы пробелом
                        this.isSpacePressed = true;
                    }
                };
                this.keyupHandler = (e) => {
                    if (e.code === 'Space') {
                        this.isSpacePressed = false;
                    }
                };

                window.addEventListener('keydown', this.keydownHandler);
                window.addEventListener('keyup', this.keyupHandler);

                this.canvas.addEventListener('mousedown', startAction);
                window.addEventListener('mouseup', endAction);
                this.canvas.addEventListener('touchstart', startAction);
                window.addEventListener('touchend', endAction);
            }

            cleanup() {
                window.removeEventListener('keydown', this.keydownHandler);
                window.removeEventListener('keyup', this.keyupHandler);
            }

            start() {
                if (this.isRunning) return;
                this.isRunning = true;
                this.catchProgress = 30;
                this.lastTime = 0;
                this.loop();
            }

            stop() {
                this.isRunning = false;
                this.cleanup();
                if (this.animationFrameId) {
                    cancelAnimationFrame(this.animationFrameId);
                }
            }

            update(deltaTime) {
                // Движение зеленой зоны (игрока)
                if (this.isSpacePressed) {
                    this.barVelocity += this.lift;
                } else {
                    this.barVelocity += this.gravity;
                }

                this.barVelocity *= this.friction;
                this.barY += this.barVelocity;

                const maxY = this.canvas.height - this.barHeight;
                if (this.barY < 0) {
                    this.barY = 0;
                    this.barVelocity = 0;
                } else if (this.barY > maxY) {
                    this.barY = maxY;
                    this.barVelocity = -this.barVelocity * 0.2; // Отскок от дна
                }

                // Логика поведения рыбы (ИИ)
                this.fishTimer -= deltaTime;
                if (this.fishTimer <= 0) {
                    this.fishTargetY = Math.random() * (this.canvas.height - this.fishSize);
                    this.fishTimer = this.currentFish.chatter * (0.6 + Math.random() * 0.8);
                }

                const diff = this.fishTargetY - this.fishY;
                this.fishY += diff * this.currentFish.speed;

                // Столкновение: находится ли рыба внутри зоны удержания?
                const isFishInside = this.fishY >= this.barY && (this.fishY + this.fishSize) <= (this.barY + this.barHeight);

                if (isFishInside) {
                    this.catchProgress += 0.18; // Заполняем прогресс улова
                } else {
                    this.catchProgress -= 0.14; // Рыба уходит
                }

                this.catchProgress = Math.max(0, Math.min(this.maxProgress, this.catchProgress));

                if (this.catchProgress >= this.maxProgress) {
                    this.stop();
                    if (this.onWin) this.onWin(this.currentFish.name);
                } else if (this.catchProgress <= 0) {
                    this.stop();
                    if (this.onLose) this.onLose();
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Отрисовка шкалы глубины
                this.ctx.fillStyle = "#1e293b";
                this.ctx.fillRect(10, 10, 45, this.canvas.height - 20);

                // Отрисовка зеленой зоны игрока
                this.ctx.fillStyle = "rgba(74, 222, 128, 0.7)";
                this.ctx.fillRect(10, this.barY, 45, this.barHeight);

                // Отрисовка рыбки
                this.ctx.fillStyle = "#f87171";
                this.ctx.fillRect(20, this.fishY, 25, this.fishSize);
                
                // Глазик для рыбки (небольшая деталь)
                this.ctx.fillStyle = "white";
                this.ctx.fillRect(36, this.fishY + 3, 4, 4);

                // Шкала успеха поимки (справа)
                const progressX = 85;
                const progressHeight = this.canvas.height - 20;
                this.ctx.fillStyle = "#334155";
                this.ctx.fillRect(progressX, 10, 15, progressHeight);

                // Заполнение шкалы прогресса
                const currentProgressHeight = (this.catchProgress / this.maxProgress) * progressHeight;
                this.ctx.fillStyle = "#fbbf24";
                this.ctx.fillRect(
                    progressX, 
                    10 + (progressHeight - currentProgressHeight), 
                    15, 
                    currentProgressHeight
                );
            }

            loop(time = 0) {
                if (!this.isRunning) return;
                
                const deltaTime = this.lastTime ? time - this.lastTime : 16;
                this.lastTime = time;

                this.update(deltaTime);
                this.draw();

                this.animationFrameId = requestAnimationFrame((t) => this.loop(t));
            }
        }

        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        
        startBtn.addEventListener('click', () => {
            const difficulties = ['easy', 'medium', 'hard'];
            const randomDiff = difficulties[Math.floor(Math.random() * difficulties.length)];
            
            startBtn.disabled = true;
            statusText.textContent = `Поклёвка! Это ${FISH_PRESETS[randomDiff].name}!`;
            statusText.style.color = '#fbbf24';

            const game = new FishingGame('fishingCanvas', randomDiff);
            
            game.onWin = (fishName) => {
                statusText.textContent = `Поймал: ${fishName}! 🎉`;
                statusText.style.color = '#4ade80';
                resetButton();
            };
            
            game.onLose = () => {
                statusText.textContent = 'Увы, рыба сорвалась... 😢';
                statusText.style.color = '#f87171';
                resetButton();
            };

            game.start();
        });

        function resetButton() {
            startBtn.disabled = false;
            startBtn.textContent = 'Забросить удочку';
        }
    </script>
</body>
</html>
